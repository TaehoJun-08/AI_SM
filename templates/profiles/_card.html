<div class="magic-card profile-card mb-4">
  <span class="avatar avatar-lg">{{ person['full_name'][0]|upper }}</span>
  <div class="flex-grow-1">
    <h2 class="mb-0">@{{ person['username'] }}</h2>
    <div class="text-muted mb-2">
      {{ person['full_name'] }} · <span class="text-capitalize">{{ person['role'] }}</span>
      · joined {{ person['created_at'][:10] }}
    </div>
    {% if person['bio'] %}
      <p class="profile-bio mb-0">{{ person['bio'] }}</p>
    {% else %}
      <p class="text-muted fst-italic mb-0">No bio yet.</p>
    {% endif %}
  </div>
</div>
