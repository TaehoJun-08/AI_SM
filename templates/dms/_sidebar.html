{% from "_icons.html" import icon %}
{% from "_avatar.html" import avatar %}


<aside class="dm-list">
  <div class="dm-list-head">
    <b>{{ user['username'] }}</b>
  </div>
  <form method="GET" action="{{ url_for('dms.inbox') }}" class="dm-search">
    {{ icon('search', 16) }}
    <input name="q" value="{{ q }}" placeholder="Search @username or name" autocomplete="off">
  </form>

  <div class="dm-scroll">
    {% include "dms/_list.html" %}
  </div>
</aside>
