{% extends "auth/_layout.html" %}
{% block title %}Forgot password · Sponsorship Matchmaker{% endblock %}
{% block form %}
<h3 class="fw-bold mb-1">Forgot your password?</h3>
<p class="text-muted mb-4">Enter the email on your account and we'll send you a link to choose a new one.</p>
<form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-4">
    <label class="form-label">Email</label>
    <input name="email" type="email" class="form-control" placeholder="you@example.com" required autofocus>
  </div>
  <button class="btn btn-primary w-100">Send reset link</button>
</form>
<p class="text-center mt-4 mb-0 small">
  <a href="{{ url_for('auth.login') }}">Back to login</a>
</p>
{% endblock %}
