{% extends "auth/_layout.html" %}
{% block title %}Register · Sponsorship Matchmaker{% endblock %}
{% block form %}
<h3 class="fw-bold mb-1">Create an account</h3>
<p class="text-muted mb-4">It takes less than a minute.</p>
<form method="POST">
  <label class="form-label">I am a…</label>
  <div class="row g-2 mb-3">
    <div class="col-6">
      <input type="radio" class="btn-check" name="role" id="role-innovator"
             value="innovator" checked>
      <label class="btn btn-outline-primary w-100 py-2" for="role-innovator">
        💡 Innovator
        <small class="d-block text-body-secondary">I have an idea</small>
      </label>
    </div>
    <div class="col-6">
      <input type="radio" class="btn-check" name="role" id="role-sponsor"
             value="sponsor">
      <label class="btn btn-outline-primary w-100 py-2" for="role-sponsor">
        🤝 Sponsor
        <small class="d-block text-body-secondary">I want to fund</small>
      </label>
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">Full name</label>
    <input name="full_name" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input name="email" type="email" class="form-control" placeholder="you@example.com" required>
  </div>
  <div class="mb-4">
    <label class="form-label">Password</label>
    <input name="password" type="password" class="form-control" minlength="6" required>
    <div class="form-text">At least 6 characters.</div>
  </div>
  <button class="btn btn-primary w-100">Register</button>
</form>
<p class="text-center mt-4 mb-0 small">
  Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
</p>
{% endblock %}
