<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sponsorship Matchmaker{% endblock %}</title>
  <link rel="stylesheet"
        href="{{ url_for('static', filename='bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
<nav class="navbar navbar-dark app-navbar px-3">
    <a class="navbar-brand" href="{{ url_for('home') }}">✨ Sponsorship Matchmaker</a>


   <div class="d-flex align-items-center gap-2">
    {% if user %}
      <a class="nav-pill" href="{{ url_for('dashboard.index') }}">Dashboard</a>
      <a class="nav-pill" href="{{ url_for('spaces.index') }}">Spaces</a>
      <div class="user-chip">
        <span class="avatar">{{ user['full_name'][0] | upper }}</span>
        <span class="d-none d-sm-block lh-sm">
          <span class="d-block fw-semibold">{{ user['full_name'] }}</span>
          <small class="text-capitalize opacity-75">{{ user['role'] }}</small>
        </span>
      </div>
      <a class="btn btn-sm btn-outline-light rounded-pill px-3"
         href="{{ url_for('auth.logout') }}">Logout</a>
    {% else %}
      <a class="btn btn-sm btn-outline-light rounded-pill px-3"
         href="{{ url_for('auth.login') }}">Login</a>
      <a class="btn btn-sm btn-light rounded-pill px-3"
         href="{{ url_for('auth.register') }}">Register</a>
    {% endif %}
  </div>
</nav>

{% block main %}
<div class="container mt-4">
  {% include "_flashes.html" %}
  {% block content %}{% endblock %}
</div>
{% endblock %}
</body>
</html>
