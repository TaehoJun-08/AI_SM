<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sponsorship Matchmaker{% endblock %}</title>
  <link rel="stylesheet"
        href="{{ url_for('static', filename='bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="{{ url_for('home') }}">Sponsorship Matchmaker</a>


  <div>
    {% if user %}
      <a class="btn btn-sm btn-primary me-2" href="{{ url_for('dashboard.index') }}">Dashboard</a>
      <span class="text-light me-3">
        {{ user['full_name'] }}
        <span class="badge text-bg-secondary text-capitalize">{{ user['role'] }}</span>
      </span>
      <a class="btn btn-sm btn-outline-light" href="{{ url_for('auth.logout') }}">Logout</a>
    {% else %}
      <a class="btn btn-sm btn-outline-light" href="{{ url_for('auth.login') }}">Login</a>
      <a class="btn btn-sm btn-light" href="{{ url_for('auth.register') }}">Register</a>
    {% endif %}
  </div>
</nav>

{% block main %}
<div class="container mt-4">
  {% include "_flashes.html" %}
  {% block content %}{% endblock %}
</div>
{% endblock %}
</body>
</html>
