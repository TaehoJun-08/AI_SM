{% from "_icons.html" import icon %}
{% from "servers/_icon.html" import srv_icon %}
<nav class="srv-rail" data-region="rail" data-live="servers">
  <a class="rail-btn home" href="{{ url_for('feed.index') }}" title="Back to the feed">✨</a>
  <div class="rail-sep"></div>
  {% for s in rail %}
    <a class="rail-btn {{ 'active' if server and server['id'] == s['id'] }}"
       href="{{ url_for('servers.view', server_id=s['id']) }}" title="{{ s['name'] }}"
       style="--c: {{ s['color'] }}">
      {{ srv_icon(s) }}
      {% set n = badges.servers.get(s['id'], 0) %}
      <i class="sn-badge" data-badge-server="{{ s['id'] }}" {% if not n %}hidden{% endif %}>{{ n if n < 100 else '99+' }}</i>
    </a>
  {% endfor %}
  <a class="rail-btn add" href="{{ url_for('servers.home') }}#create" title="Add a server">+</a>
  <a class="rail-btn add" href="{{ url_for('servers.home') }}#explore" title="Explore servers">{{ icon('compass', 22) }}</a>
</nav>
